    entity_id: ${ib_autodisarm}
    on_state: { then: [ lvgl.widget.update: { id: row_autodisarm, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_vacuum
    entity_id: ${ib_vacuum}
    on_state: { then: [ lvgl.widget.update: { id: row_vacuum, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_thermo_living
    entity_id: ${ib_thermo_living}
    on_state: { then: [ lvgl.widget.update: { id: row_thermo_living, state: { checked: !lambda 'return x;' } } ] }
