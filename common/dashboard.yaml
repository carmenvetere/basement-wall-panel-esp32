# -------------------------------------------------------------------
#  STATE
# -------------------------------------------------------------------

globals:
  - id: code_buffer
    type: std::string
    restore_value: no
    initial_value: '""'

# -------------------------------------------------------------------
#  SCRIPTS (shared HA calls — keeps the UI section terse)
# -------------------------------------------------------------------

script:
  - id: ha_scene
    parameters: { eid: string }
    then:
      - homeassistant.action:
          action: scene.turn_on
          data: { entity_id: !lambda 'return eid;' }
  - id: ha_toggle
    parameters: { eid: string }
    then:
      - homeassistant.action:
          action: homeassistant.toggle
          data: { entity_id: !lambda 'return eid;' }
  - id: code_append
    parameters: { d: string }
    then:
      - lambda: |-
          id(code_buffer) += d;
          if (id(code_buffer).length() >= 4) {
            if (id(code_buffer) == "${alarm_user_code}") {
              // correct code -> toggle armed/disarmed via HA
              std::string st = id(txt_alarm_state).state;
              if (st == "disarmed" || st.empty()) {
                id(call_arm_away).execute();
              } else {
                id(call_disarm).execute();
              }
              id(code_buffer) = "";
              id(set_code_dots).execute();
            } else {
              id(code_buffer) = "";
              id(flash_code_error).execute();
            }
          } else {
            id(set_code_dots).execute();
          }
  - id: code_clear
    then:
      - lambda: 'id(code_buffer) = "";'
      - script.execute: set_code_dots
  - id: code_backspace
    then:
      - lambda: 'if(!id(code_buffer).empty()) id(code_buffer).pop_back();'
      - script.execute: set_code_dots
  - id: set_code_dots
    then:
      - lambda: |-
          int n = id(code_buffer).length();
          lv_obj_t * dots[4] = { id(dot0), id(dot1), id(dot2), id(dot3) };
          for (int i = 0; i < 4; i++) {
            bool on = i < n;
            lv_obj_set_style_bg_opa(dots[i], on ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          }
  - id: flash_code_error
    then:
      - lambda: |-
          lv_obj_t * dots[4] = { id(dot0), id(dot1), id(dot2), id(dot3) };
          for (int i = 0; i < 4; i++) {
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(${color_alert}), 0);
            lv_obj_set_style_bg_opa(dots[i], LV_OPA_COVER, 0);
          }
      - delay: 650ms
      - lambda: |-
          lv_obj_t * dots[4] = { id(dot0), id(dot1), id(dot2), id(dot3) };
          for (int i = 0; i < 4; i++) {
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(${color_accent}), 0);
            lv_obj_set_style_bg_opa(dots[i], LV_OPA_TRANSP, 0);
          }
  - id: call_arm_away
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data: { entity_id: "${entity_alarm}" }
  - id: call_disarm
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data: { entity_id: "${entity_alarm}", code: "${alarm_user_code}" }

# ===================================================================
#  HOME ASSISTANT  <->  WIDGET BINDINGS
# ===================================================================

text_sensor:
  - platform: homeassistant
    id: txt_alarm_state
    entity_id: ${entity_alarm}
    on_value:
      - lvgl.label.update:
          id: lbl_alarm_sub
          text: !lambda |-
            if (x == "armed_away") return std::string("Armed · Away");
            if (x == "armed_home") return std::string("Armed · Home");
            if (x == "armed_night") return std::string("Armed · Night");
            return std::string("Disarmed");
      - lvgl.label.update:
          id: lbl_sec_title
          text: !lambda |-
            if (x == "disarmed" || x.empty()) return std::string("Ready to arm");
            if (x == "armed_away") return std::string("Armed · Away");
            if (x == "armed_home") return std::string("Armed · Home");
            if (x == "armed_night") return std::string("Armed · Night");
            return std::string("Armed");

  - platform: homeassistant
    id: txt_scene
    entity_id: ${entity_scene_select}
    on_value:
      - lvgl.label.update: { id: lbl_scene_sub, text: !lambda 'return x.empty() ? std::string("None active") : x + " active";' }

  - platform: homeassistant
    id: txt_track
    entity_id: ${entity_media_player}
    attribute: media_title
    on_value:
      - lvgl.label.update: { id: lbl_track, text: !lambda 'return x.empty() ? std::string("Nothing playing") : x;' }
      - lvgl.label.update: { id: lbl_music_sub, text: !lambda 'return x.empty() ? std::string("Paused") : x;' }
  - platform: homeassistant
    id: txt_artist
    entity_id: ${entity_media_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update: { id: lbl_artist, text: !lambda 'return x;' }

  - platform: homeassistant
    id: txt_filter
    entity_id: ${select_pool_filter}
    # NOTE: highlight handled in README pattern; sub-label below
    on_value:
      - lvgl.label.update:
          id: lbl_pool_sub
          text: !lambda 'return std::string("Filter ") + x;'


sensor:
  - platform: homeassistant
    id: num_outdoor_temp
    entity_id: ${entity_outdoor_temp}
    on_value:
      - lvgl.label.update: { id: lbl_temp, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d°",(int)x); return std::string(b);' }

  - platform: homeassistant
    id: num_pool_water
    entity_id: ${entity_pool_water}
    on_value:
      - lvgl.label.update: { id: lbl_pool_water, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d°",(int)x); return std::string(b);' }

  - platform: homeassistant
    id: num_pool_setpoint
    entity_id: ${number_pool_setpoint}
    on_value:
      - lvgl.label.update: { id: lbl_setpoint, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d°",(int)x); return std::string(b);' }

  - platform: homeassistant
    id: num_alerts
    entity_id: ${entity_alert_count}
    on_value:
      - lvgl.label.update: { id: lbl_badge, text: !lambda 'char b[4]; snprintf(b,sizeof(b),"%d",(int)x); return std::string(b);' }
      - lvgl.widget.update:
          id: badge_bell
          hidden: !lambda 'return x < 1;'

  # Shade positions -> sliders + labels
  - platform: homeassistant
    id: num_shade_living
    entity_id: ${cover_living}
    attribute: current_position
    on_value:
      - lvgl.slider.update: { id: sld_shade_living, value: !lambda 'return x;' }
      - lvgl.label.update: { id: lbl_shade_living, text: !lambda 'return x==0?std::string("Closed"):x==100?std::string("Open"):to_string((int)x)+"% open";' }
  - platform: homeassistant
    id: num_shade_bedroom
    entity_id: ${cover_bedroom}
    attribute: current_position
    on_value:
      - lvgl.slider.update: { id: sld_shade_bedroom, value: !lambda 'return x;' }
      - lvgl.label.update: { id: lbl_shade_bedroom, text: !lambda 'return x==0?std::string("Closed"):x==100?std::string("Open"):to_string((int)x)+"% open";' }
  - platform: homeassistant
    id: num_shade_kitchen
    entity_id: ${cover_kitchen}
    attribute: current_position
    on_value:
      - lvgl.slider.update: { id: sld_shade_kitchen, value: !lambda 'return x;' }
      - lvgl.label.update: { id: lbl_shade_kitchen, text: !lambda 'return x==0?std::string("Closed"):x==100?std::string("Open"):to_string((int)x)+"% open";' }

  - platform: homeassistant
    id: num_volume
    entity_id: ${entity_media_player}
    attribute: volume_level
    on_value:
      - lvgl.slider.update: { id: sld_volume, value: !lambda 'return (int)(x*100);' }


binary_sensor:
  # Contextual banners on Home
  - platform: homeassistant
    id: bs_power_outage
    entity_id: ${entity_power_outage}
    on_state:
      - lvgl.widget.update: { id: banner_power, hidden: !lambda 'return !x;' }
  - platform: homeassistant
    id: bs_sprinkler
    entity_id: ${entity_sprinkler_run}
    on_state:
      - lvgl.widget.update: { id: banner_sprinkler, hidden: !lambda 'return !x;' }
      - lvgl.widget.update: { id: card_sprinkler_run, hidden: !lambda 'return !x;' }
      - lvgl.widget.update: { id: card_sprinkler_idle, hidden: !lambda 'return x;' }

  # Pool heater state -> switch widget (see README re: feedback loops)
  - platform: homeassistant
    id: bs_pool_heater
    entity_id: ${switch_pool_heater}
    on_state:
      - lvgl.widget.update: { id: sw_heater, state: { checked: !lambda 'return x;' } }

  # ---- Settings toggles: reflect input_boolean state on each row ----
  - platform: homeassistant
    id: bs_dinner
    entity_id: ${ib_dinner}
    on_state: { then: [ lvgl.widget.update: { id: row_dinner, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_guests
    entity_id: ${ib_guests}
    on_state: { then: [ lvgl.widget.update: { id: row_guests, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_cleaners
    entity_id: ${ib_cleaners}
    on_state: { then: [ lvgl.widget.update: { id: row_cleaners, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_away
    entity_id: ${ib_away}
    on_state: { then: [ lvgl.widget.update: { id: row_away, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
    id: bs_autoarm_away
    entity_id: ${ib_autoarm_away}
    on_state: { then: [ lvgl.widget.update: { id: row_autoarm_away, state: { checked: !lambda 'return x;' } } ] }
  - platform: homeassistant
