# -------------------------------------------------------------------
#  CORE
# -------------------------------------------------------------------

logger:
  level: INFO


time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: '*'
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                auto t = id(ha_time).now();
                if (!t.is_valid()) return std::string("--:--");
                int h = t.hour % 12; if (h == 0) h = 12;
                char b[8]; snprintf(b, sizeof(b), "%d:%02d", h, t.minute);
                return std::string(b);
          - lvgl.label.update:
              id: lbl_ampm
              text: !lambda 'return id(ha_time).now().hour >= 12 ? "PM" : "AM";'

