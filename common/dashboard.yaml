# ===================================================================
#  common/dashboard.yaml  —  SHARED core (hardware-independent)
#
#  Everything that is the same whether you run on a real ESP32-S3 panel
#  or in the desktop simulator: design tokens + entity map, fonts,
#  Home Assistant <-> widget bindings, scripts, and the LVGL UI itself.
#
#  Composed as a package by:
#     nspanel-dashboard.yaml   (real hardware: ESP32-S3 + ST7701S + GT911)
#     simulator/simulator.yaml (desktop preview: host + SDL)
#
#  Those files add the platform-specific bits (board, Wi-Fi/OTA, display,
#  touchscreen). Do not add esp32:/display:/touchscreen: here.
# ===================================================================

substitutions:
  device_name: "wall-panel"
  friendly_name: "Wall Panel"

  # ---- Colour palette (charcoal granite + single steel-blue accent) ----
  color_bg:             "0x202327"   # screen background
  color_surface:        "0x2B2F34"   # cards / tiles / keys
  color_surface_raised: "0x353A40"   # pressed / secondary buttons
  color_pill_off:       "0x363B41"   # settings row, OFF state
  color_border:         "0xEAE6DD"   # border colour (used at 8% opa)
  color_text:           "0xE9E5DD"   # primary text
  color_text2:          "0x9A988F"   # secondary text
  color_icon:           "0xB4AFA4"   # idle icons
  color_dim:            "0x8B8980"   # tertiary / disabled
  color_accent:         "0x7295B2"   # steel blue — active states only
  color_accent_light:   "0xA9C4DD"   # text on accent-tinted surfaces
  color_on_accent:      "0xF4F2EC"   # text/icon on solid accent
  color_alert:          "0xC8805F"   # rust — critical alerts
  color_warning:        "0xCBA14E"   # amber — warnings
  color_white:          "0xFFFFFF"

  # ---- TODO: Home Assistant entity IDs (placeholders) ----
  entity_outdoor_temp:    "sensor.outdoor_temperature"
  entity_weather:         "weather.home"

  # scenes
  entity_scene_select:    "input_select.active_scene"   # text_sensor mirror of current scene
  scene_morning:          "scene.morning"
  scene_movie:            "scene.movie"
  scene_away:             "scene.away"
  scene_goodnight:        "scene.goodnight"
  scene_dinner:           "scene.dinner"
  scene_focus:            "scene.focus"
  scene_all_off:          "script.all_off"

  # music
  entity_media_player:    "media_player.living_room"

  # shades (covers)
  cover_living:           "cover.living_room_shades"
  cover_bedroom:          "cover.bedroom_shades"
  cover_kitchen:          "cover.kitchen_shades"

  # alarm
  entity_alarm:           "alarm_control_panel.home"
  alarm_user_code:        "1234"                          # local pre-check before calling HA

  # sprinklers
  entity_sprinkler_run:   "binary_sensor.irrigation_active"
  entity_sprinkler_zone:  "sensor.irrigation_current_zone"
  entity_sprinkler_time:  "sensor.irrigation_time_remaining"
  switch_sprinkler:       "switch.irrigation"

  # alerts / power
  entity_alert_count:     "sensor.active_alerts"          # numeric count -> badge
  entity_power_outage:    "binary_sensor.grid_power_lost"

  # pool
  entity_pool_water:      "sensor.pool_water_temperature"
  select_pool_filter:     "select.pool_pump_speed"        # options: Off/Low/Medium/High
  switch_pool_heater:     "switch.pool_heater"
  number_pool_setpoint:   "number.pool_heater_setpoint"

  # settings — input_booleans (Home Modes / Automations / Climate / Panel)
  ib_dinner:        "input_boolean.mode_dinner_party"
  ib_guests:        "input_boolean.mode_overnight_guests"
  ib_cleaners:      "input_boolean.mode_cleaners"
  ib_away:          "input_boolean.mode_away"
  ib_autoarm_away:  "input_boolean.auto_arm_away"
  ib_autoarm_home:  "input_boolean.auto_arm_home"
  ib_autodisarm:    "input_boolean.auto_disarm"
  ib_vacuum:        "input_boolean.nightly_vacuum"
  ib_thermo_living: "input_boolean.schedule_living_thermostat"
  ib_thermo_bed:    "input_boolean.schedule_bedroom_thermostat"
  ib_thermo_office: "input_boolean.schedule_office_thermostat"
  ib_auto_bright:   "input_boolean.panel_auto_brightness"
  ib_screensaver:   "input_boolean.panel_screensaver"
  ib_touch_sounds:  "input_boolean.panel_touch_sounds"

  # ---- TODO: verify icon codepoints (Material Design Icons) ----
  # Format: "\U000FXXXX". Names in comments — check pictogrammers.com.
  i_back:        "\U000F004D"   # mdi:arrow-left
  i_bell:        "\U000F009A"   # mdi:bell
