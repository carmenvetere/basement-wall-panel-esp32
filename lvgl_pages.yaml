                      height: 44
                      radius: 12
                      pad_left: 17
                      pad_right: 17
                      bg_color: $color_accent
                      bg_opa: 16%
                      border_width: 1
                      border_color: $color_accent
                      border_opa: 40%
                      on_click: { homeassistant.action: { action: switch.turn_on, data: { entity_id: "${switch_sprinkler}" } } }
                      widgets: [ { label: { align: CENTER, text: "Resume", text_font: manrope_15, text_color: $color_accent_light } } ]
            - label: { text: "ZONES", styles: section, margin_top: 6, margin_left: 2, margin_bottom: 4 }
            - &zone_row
              obj:
                styles: card
                width: 100%
                pad_all: 14
