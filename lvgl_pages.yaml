                  bg_color: $color_accent
                  bg_opa: COVER
                  border_opa: 0%
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                on_click: { script.execute: { id: ha_toggle, eid: "${ib_dinner}" } }
                widgets:
                  - label: { text: "${i_party}", text_font: icons_22, text_color: $color_icon }
                  - label: { text: "Dinner Party", text_font: manrope_15, text_color: 0xC4C0B6, flex_grow: 1, long_mode: DOT }
                  - label: { text: "Off", text_font: manrope_14, text_color: $color_dim }
            - button:
                id: row_guests
                checkable: true
                width: 100%
                height: 54
                radius: 15
                bg_color: $color_pill_off
                bg_opa: COVER
                border_width: 1
                border_color: $color_border
                border_opa: 8%
                pad_left: 16
                pad_right: 16
                checked: { bg_color: $color_accent, bg_opa: COVER, border_opa: 0% }
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                on_click: { script.execute: { id: ha_toggle, eid: "${ib_guests}" } }
                widgets:
                  - label: { text: "${i_bed}", text_font: icons_22, text_color: $color_icon }
                  - label: { text: "Overnight Guests", text_font: manrope_15, text_color: 0xC4C0B6, flex_grow: 1, long_mode: DOT }
                  - label: { text: "Off", text_font: manrope_14, text_color: $color_dim }
            - button:
                id: row_cleaners
                checkable: true
                width: 100%
                height: 54
                radius: 15
                bg_color: $color_pill_off
                bg_opa: COVER
                border_width: 1
                border_color: $color_border
                border_opa: 8%
                pad_left: 16
                pad_right: 16
                checked: { bg_color: $color_accent, bg_opa: COVER, border_opa: 0% }
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                on_click: { script.execute: { id: ha_toggle, eid: "${ib_cleaners}" } }
                widgets:
                  - label: { text: "${i_broom}", text_font: icons_22, text_color: $color_icon }
                  - label: { text: "Cleaners Mode", text_font: manrope_15, text_color: 0xC4C0B6, flex_grow: 1, long_mode: DOT }
                  - label: { text: "Off", text_font: manrope_14, text_color: $color_dim }
            - button:
                id: row_away
                checkable: true
                width: 100%
                height: 54
                radius: 15
                bg_color: $color_pill_off
                bg_opa: COVER
                border_width: 1
                border_color: $color_border
                border_opa: 8%
                pad_left: 16
                pad_right: 16
                checked: { bg_color: $color_accent, bg_opa: COVER, border_opa: 0% }
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                on_click: { script.execute: { id: ha_toggle, eid: "${ib_away}" } }
                widgets:
                  - label: { text: "${i_luggage}", text_font: icons_22, text_color: $color_icon }
