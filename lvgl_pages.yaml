                  - obj: { flex_grow: 1, height: 2, radius: 1, bg_color: $color_border, bg_opa: 10%, border_width: 0, pad_all: 0 }
            # toggle row pattern: checkable button, checked => accent fill
            - &toggle_row
              button:
                id: row_dinner
                checkable: true
                width: 100%
                height: 54
                radius: 15
                bg_color: $color_pill_off
                bg_opa: COVER
                border_width: 1
                border_color: $color_border
