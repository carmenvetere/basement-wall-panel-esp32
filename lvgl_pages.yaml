# ===================================================================
#  lvgl_pages.yaml  —  the LVGL block (included by nspanel-dashboard.yaml)
#  Substitutions ($color_*, $i_*, entity_*) resolve from the parent file.
# ===================================================================
displays: [main_display]
touchscreens: [main_touch]
color_depth: 16
bg_color: $color_bg
default_font: manrope_16
disp_bg_color: $color_bg

# ---- Reusable styles ------------------------------------------------
style_definitions:
  - id: card
    bg_color: $color_surface
    bg_opa: COVER
    radius: 18
    border_width: 1
    border_color: $color_border
    border_opa: 8%
    pad_all: 16
  - id: plain                       # transparent container, no chrome
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    radius: 0
  - id: tile
    bg_color: $color_surface
    bg_opa: COVER
    radius: 18
    border_width: 1
    border_color: $color_border
    border_opa: 8%
    pad_left: 17
    pad_right: 17
    pad_top: 13
    pad_bottom: 13
  - id: back_btn
    bg_color: $color_surface
    bg_opa: COVER
    radius: 12
    border_width: 1
    border_color: $color_border
    border_opa: 8%
    width: 42
    height: 42
  - id: title                       # screen title label
    text_font: manrope_24
    text_color: $color_text
  - id: section                     # uppercase section label
    text_font: manrope_13
    text_color: $color_dim
    text_letter_space: 1
  - id: tile_title
    text_font: manrope_20
    text_color: $color_text
  - id: tile_sub
    text_font: manrope_14
    text_color: $color_text2
  - id: icon_neutral
    text_font: icons_30
    text_color: $color_icon

# Top layer: nothing global
top_layer:
  widgets: []

# ===================================================================
pages:

  # ---------------------------------------------------------------
  #  1. HOME   (must never scroll — grid flexes to fit)
  # ---------------------------------------------------------------
  - id: page_home
    bg_color: $color_bg
    bg_opa: COVER
    scrollbar_mode: "OFF"
    pad_all: 0
    layout:
      type: flex
      flex_flow: COLUMN
      flex_align_cross: STRETCH
    widgets:
      # Header row: clock left, weather + bell right
      - obj:
          styles: plain
          width: 100%
          height: 78
          pad_left: 20
          pad_right: 20
          pad_top: 18
          layout:
            type: flex
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
          widgets:
            - obj:
                styles: plain
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                layout: { type: flex, flex_flow: ROW, flex_align_cross: END, pad_column: 6 }
                widgets:
                  - label: { id: lbl_clock, text: "9:41", text_font: manrope_56, text_color: $color_text }
                  - label: { id: lbl_ampm, text: "AM", text_font: manrope_20, text_color: $color_dim, pad_bottom: 8 }
            - obj:
                styles: plain
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 14 }
                widgets:
                  - label: { text: "${i_weather}", text_font: icons_28, text_color: $color_icon }
                  - label: { id: lbl_temp, text: "72°", text_font: manrope_26, text_color: $color_text }
                  - button:
                      id: btn_bell
                      width: 42
                      height: 42
                      styles: back_btn
                      on_click: { lvgl.page.show: page_alerts }
                      widgets:
                        - label: { align: CENTER, text: "${i_bell}", text_font: icons_24, text_color: $color_icon }
                        - obj:
                            id: badge_bell
                            align: TOP_RIGHT
                            x: 6
                            y: -6
                            width: 20
                            height: 20
                            radius: 10
                            bg_color: $color_alert
                            bg_opa: COVER
                            border_width: 0
                            pad_all: 0
                            widgets:
                              - label: { id: lbl_badge, align: CENTER, text: "3", text_font: manrope_13, text_color: $color_bg }

      # Contextual banner: power outage (hidden until binary_sensor true)
      - obj:
          id: banner_power
          hidden: true
          width: 100%
          height: 58
          margin_left: 16
          margin_right: 16
          margin_bottom: 8
          bg_color: $color_alert
          bg_opa: 12%
          radius: 15
          border_width: 1
          border_color: $color_alert
          border_opa: 30%
          pad_left: 14
          pad_right: 14
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 11 }
          on_click: { lvgl.page.show: page_alerts }
          widgets:
            - label: { text: "${i_flash}", text_font: icons_22, text_color: $color_alert }
            - obj:
                styles: plain
                flex_grow: 1
                height: SIZE_CONTENT
                layout: { type: flex, flex_flow: COLUMN, pad_row: 1 }
                widgets:
                  - label: { text: "Power outage detected", text_font: manrope_15, text_color: 0xD49476 }
                  - label: { text: "Running on battery backup", text_font: manrope_13, text_color: $color_text2 }
            - label: { text: "${i_chevron_r}", text_font: icons_22, text_color: $color_alert }

      # Contextual banner: sprinklers running (hidden until true)
      - obj:
          id: banner_sprinkler
          hidden: true
          width: 100%
          height: 58
          margin_left: 16
          margin_right: 16
          margin_bottom: 8
          bg_color: $color_accent
          bg_opa: 12%
          radius: 15
          border_width: 1
          border_color: $color_accent
          border_opa: 30%
          pad_left: 14
          pad_right: 12
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 11 }
          on_click: { lvgl.page.show: page_sprinklers }
          widgets:
            - label: { text: "${i_water}", text_font: icons_22, text_color: $color_accent }
            - obj:
                styles: plain
                flex_grow: 1
                height: SIZE_CONTENT
                layout: { type: flex, flex_flow: COLUMN, pad_row: 1 }
                widgets:
                  - label: { text: "Sprinklers running", text_font: manrope_15, text_color: $color_accent_light }
                  - label: { text: "Front Lawn · 12:40 left", text_font: manrope_13, text_color: $color_text2 }
            - button:
                width: SIZE_CONTENT
                height: 38
                bg_color: $color_accent
                bg_opa: COVER
                radius: 11
                pad_left: 14
                pad_right: 14
                on_click:
                  - homeassistant.action: { action: switch.turn_off, data: { entity_id: "${switch_sprinkler}" } }
                widgets:
                  - label: { align: CENTER, text: "Pause", text_font: manrope_15, text_color: $color_on_accent }

      # 2x3 tile grid — flex_grow:1 makes it absorb remaining height (no scroll)
      - obj:
          styles: plain
          width: 100%
          flex_grow: 1
          pad_left: 16
          pad_right: 16
          pad_bottom: 14
          layout:
            type: grid
            grid_columns: [FR(1), FR(1)]
            grid_rows: [FR(1), FR(1), FR(1)]
            grid_column_align: STRETCH
            grid_row_align: STRETCH
            pad_column: 10
            pad_row: 10
          widgets:
            - &tile_def
              button:
                styles: tile
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_scenes }
                widgets:
                  - label: { text: "${i_scenes}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Scenes", styles: tile_title }
                        - label: { id: lbl_scene_sub, text: "Movie active", styles: tile_sub }
            - button:
                styles: tile
                grid_cell_column_pos: 1
                grid_cell_row_pos: 0
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_music }
                widgets:
                  - label: { text: "${i_music}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Music", styles: tile_title }
                        - label: { id: lbl_music_sub, text: "Holocene", styles: tile_sub }
            - button:
                styles: tile
                grid_cell_column_pos: 0
                grid_cell_row_pos: 1
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_shades }
                widgets:
                  - label: { text: "${i_blinds}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Shades", styles: tile_title }
                        - label: { id: lbl_shade_sub, text: "2 of 3 open", styles: tile_sub }
            - button:
                styles: tile
                grid_cell_column_pos: 1
                grid_cell_row_pos: 1
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_security }
                widgets:
                  - label: { id: lbl_alarm_icon, text: "${i_shield}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Alarm", styles: tile_title }
                        - label: { id: lbl_alarm_sub, text: "Disarmed", styles: tile_sub }
            - button:
                styles: tile
                grid_cell_column_pos: 0
                grid_cell_row_pos: 2
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_pool }
                widgets:
                  - label: { text: "${i_pool}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Pool", styles: tile_title }
                        - label: { id: lbl_pool_sub, text: "Heater 84° · High", styles: tile_sub }
            - button:
                styles: tile
                grid_cell_column_pos: 1
                grid_cell_row_pos: 2
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 15 }
                on_click: { lvgl.page.show: page_settings }
                widgets:
                  - label: { text: "${i_tune}", styles: icon_neutral }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - label: { text: "Settings", styles: tile_title }
                        - label: { id: lbl_settings_sub, text: "8 enabled", styles: tile_sub }

  # ---------------------------------------------------------------
  #  2. SCENES
  # ---------------------------------------------------------------
  - id: page_scenes
    bg_color: $color_bg
    bg_opa: COVER
    scrollbar_mode: "OFF"
    pad_all: 0
    layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH }
    widgets:
      - &header_scenes
        obj:
          styles: plain
          width: 100%
          height: 60
          pad_left: 18
          pad_top: 17
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
          widgets:
            - button:
                styles: back_btn
                on_click: { lvgl.page.show: page_home }
                widgets: [ { label: { align: CENTER, text: "${i_back}", text_font: icons_22, text_color: $color_icon } } ]
            - label: { text: "Scenes", styles: title }
      - obj:
          styles: plain
          width: 100%
          flex_grow: 1
          pad_left: 16
          pad_right: 16
          pad_bottom: 18
          scrollbar_mode: AUTO
          layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH, pad_row: 12 }
          widgets:
            # 3 rows of 2 scene cards
            - obj:
                styles: plain
                width: 100%
                height: 108
                layout: { type: flex, flex_flow: ROW, pad_column: 12 }
                widgets:
                  - &scene_card
                    button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_morning}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_morning}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Morning", text_font: manrope_18, text_color: $color_text }
                  - button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_movie}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_movie}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Movie", text_font: manrope_18, text_color: $color_text }
            - obj:
                styles: plain
                width: 100%
                height: 108
                layout: { type: flex, flex_flow: ROW, pad_column: 12 }
                widgets:
                  - button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_away}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_luggage}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Evening", text_font: manrope_18, text_color: $color_text }
                  - button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_goodnight}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_night}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Goodnight", text_font: manrope_18, text_color: $color_text }
            - obj:
                styles: plain
                width: 100%
                height: 108
                layout: { type: flex, flex_flow: ROW, pad_column: 12 }
                widgets:
                  - button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_dinner}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_dinner}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Dinner", text_font: manrope_18, text_color: $color_text }
                  - button:
                      flex_grow: 1
                      height: 108
                      styles: tile
                      pad_all: 16
                      layout: { type: flex, flex_flow: COLUMN, flex_align_main: SPACE_BETWEEN }
                      on_click: { script.execute: { id: ha_scene, eid: "${scene_focus}" } }
                      widgets:
                        - obj: { width: 44, height: 44, radius: 13, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_focus}", text_font: icons_24, text_color: $color_icon } } ] }
                        - label: { text: "Welcome", text_font: manrope_18, text_color: $color_text }
            # All Off — full width pill
            - button:
                width: 100%
                height: 58
                bg_color: $color_surface
                bg_opa: COVER
                radius: 18
                border_width: 1
                border_color: $color_border
                border_opa: 8%
                layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10 }
                on_click: { script.execute: { id: ha_scene, eid: "${scene_all_off}" } }
                widgets:
                  - label: { text: "${i_power}", text_font: icons_24, text_color: $color_icon }
                  - label: { text: "All Off", text_font: manrope_18, text_color: $color_text }

  # ---------------------------------------------------------------
  #  3. MUSIC
  # ---------------------------------------------------------------
  - id: page_music
    bg_color: $color_bg
    bg_opa: COVER
    scrollbar_mode: "OFF"
    pad_all: 0
    layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH }
    widgets:
      - obj:
          styles: plain
          width: 100%
          height: 60
          pad_left: 18
          pad_top: 17
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
          widgets:
            - button: { styles: back_btn, on_click: { lvgl.page.show: page_home }, widgets: [ { label: { align: CENTER, text: "${i_back}", text_font: icons_22, text_color: $color_icon } } ] }
            - label: { text: "Music", styles: title }
      - obj:
          styles: card
          width: 100%
          margin_left: 16
          margin_right: 16
          layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH, pad_row: 16 }
          widgets:
            # now-playing row
            - obj:
                styles: plain
                width: 100%
                height: 104
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 16 }
                widgets:
                  - obj:
                      width: 104
                      height: 104
                      radius: 16
                      bg_color: $color_surface_raised
                      bg_opa: COVER
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      pad_all: 0
                      widgets: [ { label: { align: CENTER, text: "${i_album}", text_font: icons_34, text_color: $color_dim } } ]
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 4 }
                      widgets:
                        - obj:
                            styles: plain
                            width: SIZE_CONTENT
                            height: SIZE_CONTENT
                            layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 5 }
                            widgets:
                              - label: { text: "${i_eq}", text_font: icons_22, text_color: $color_accent }
                              - label: { id: lbl_room, text: "Living Room", text_font: manrope_13, text_color: $color_accent }
                        - label: { id: lbl_track, text: "Holocene", text_font: manrope_24, text_color: $color_text, long_mode: DOT, width: 220 }
                        - label: { id: lbl_artist, text: "Bon Iver", text_font: manrope_15, text_color: $color_text2 }
            # progress bar
            - bar:
                id: bar_progress
                width: 100%
                height: 6
                min_value: 0
                max_value: 100
                value: 41
                bg_color: $color_border
                bg_opa: 9%
                indicator: { bg_color: $color_accent, bg_opa: COVER }
            # transport
            - obj:
                styles: plain
                width: 100%
                height: 64
                layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 24 }
                widgets:
                  - label: { text: "${i_shuffle}", text_font: icons_22, text_color: $color_dim }
                  - label: { text: "${i_prev}", text_font: icons_34, text_color: $color_text }
                  - button:
                      id: btn_play
                      width: 64
                      height: 64
                      radius: 32
                      bg_color: $color_accent
                      bg_opa: COVER
                      on_click:
                        - homeassistant.action: { action: media_player.media_play_pause, data: { entity_id: "${entity_media_player}" } }
                      widgets: [ { label: { id: lbl_play, align: CENTER, text: "${i_pause}", text_font: icons_34, text_color: $color_on_accent } } ]
                  - label: { text: "${i_next}", text_font: icons_34, text_color: $color_text }
                  - label: { text: "${i_repeat}", text_font: icons_22, text_color: $color_dim }
            # volume
            - obj:
                styles: plain
                width: 100%
                height: SIZE_CONTENT
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                widgets:
                  - label: { text: "${i_vol}", text_font: icons_22, text_color: $color_dim }
                  - slider:
                      id: sld_volume
                      flex_grow: 1
                      height: 8
                      min_value: 0
                      max_value: 100
                      value: 38
                      bg_color: $color_border
                      bg_opa: 9%
                      indicator: { bg_color: $color_accent, bg_opa: COVER, radius: 4 }
                      knob: { bg_color: $color_text, bg_opa: COVER, radius: 9, pad_all: 7 }
                      on_release:
                        - homeassistant.action:
                            action: media_player.volume_set
                            data: { entity_id: "${entity_media_player}", volume_level: !lambda 'return x/100.0;' }
                  - label: { id: lbl_volnum, text: "38", text_font: manrope_15, text_color: $color_icon, width: 32 }
      # rooms
      - label: { text: "PLAYING IN", styles: section, margin_left: 18, margin_top: 18, margin_bottom: 10 }
      - obj:
          styles: plain
          width: 100%
          height: 48
          pad_left: 16
          pad_right: 16
          scrollbar_mode: "OFF"
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - &room_chip
              button:
                width: SIZE_CONTENT
                height: 44
                radius: 22
                pad_left: 16
                pad_right: 16
                bg_color: $color_accent
                bg_opa: 16%
                border_width: 1
                border_color: $color_accent
                border_opa: 50%
                widgets: [ { label: { align: CENTER, text: "First Floor", text_font: manrope_14, text_color: $color_accent_light } } ]
            - button: { width: SIZE_CONTENT, height: 44, radius: 22, pad_left: 16, pad_right: 16, bg_color: $color_surface, bg_opa: COVER, border_width: 1, border_color: $color_border, border_opa: 8%, widgets: [ { label: { align: CENTER, text: "Bedroom Side", text_font: manrope_14, text_color: $color_icon } } ] }
