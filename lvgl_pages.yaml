                widgets:
                  - button: { styles: back_btn, on_click: { lvgl.page.show: page_home }, widgets: [ { label: { align: CENTER, text: "${i_back}", text_font: icons_22, text_color: $color_icon } } ] }
                  - label: { text: "Alerts", styles: title }
            - label: { text: "Clear all", text_font: manrope_14, text_color: $color_dim }
      - obj:
          styles: plain
          width: 100%
          flex_grow: 1
          pad_left: 16
          pad_right: 16
          pad_bottom: 18
          scrollbar_mode: AUTO
          layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH, pad_row: 10 }
          widgets:
            - &alert_row
              obj:
                styles: card
                width: 100%
                pad_all: 15
                layout: { type: flex, flex_flow: ROW, flex_align_cross: START, pad_column: 12 }
                widgets:
                  - obj: { width: 42, height: 42, radius: 13, bg_color: $color_alert, bg_opa: 14%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_flash}", text_font: icons_22, text_color: $color_alert } } ] }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - obj:
                            styles: plain
                            width: 100%
                            height: SIZE_CONTENT
                            layout: { type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN }
                            widgets:
                              - label: { text: "Power Outage", text_font: manrope_17, text_color: $color_text }
                              - label: { text: "2 min ago", text_font: manrope_13, text_color: $color_dim }
                        - label: { text: "Mains power lost · running on battery backup", text_font: manrope_14, text_color: 0xA5A299, long_mode: WRAP, width: 320 }
            - obj:
                styles: card
                width: 100%
                pad_all: 15
                layout: { type: flex, flex_flow: ROW, flex_align_cross: START, pad_column: 12 }
                widgets:
                  - obj: { width: 42, height: 42, radius: 13, bg_color: $color_warning, bg_opa: 14%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_door}", text_font: icons_22, text_color: $color_warning } } ] }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - obj:
                            styles: plain
                            width: 100%
                            height: SIZE_CONTENT
                            layout: { type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN }
                            widgets:
                              - label: { text: "Garage Door Open", text_font: manrope_17, text_color: $color_text }
                              - label: { text: "18 min ago", text_font: manrope_13, text_color: $color_dim }
                        - label: { text: "Open for 22 minutes", text_font: manrope_14, text_color: 0xA5A299 }
            - obj:
                styles: card
                width: 100%
                pad_all: 15
                layout: { type: flex, flex_flow: ROW, flex_align_cross: START, pad_column: 12 }
                widgets:
                  - obj: { width: 42, height: 42, radius: 13, bg_color: $color_accent, bg_opa: 14%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_lock}", text_font: icons_22, text_color: $color_accent } } ] }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 3 }
                      widgets:
                        - obj:
                            styles: plain
                            width: 100%
                            height: SIZE_CONTENT
                            layout: { type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN }
                            widgets:
                              - label: { text: "Front Door Locked", text_font: manrope_17, text_color: $color_text }
                              - label: { text: "1 hr ago", text_font: manrope_13, text_color: $color_dim }
                        - label: { text: "Auto-locked at 9:00 PM", text_font: manrope_14, text_color: 0xA5A299 }

  # ---------------------------------------------------------------
  #  8. POOL
  # ---------------------------------------------------------------
  - id: page_pool
    bg_color: $color_bg
    bg_opa: COVER
    pad_all: 0
    layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH }
    widgets:
      - obj:
          styles: plain
          width: 100%
          height: 60
          pad_left: 18
          pad_top: 17
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
          widgets:
            - button: { styles: back_btn, on_click: { lvgl.page.show: page_home }, widgets: [ { label: { align: CENTER, text: "${i_back}", text_font: icons_22, text_color: $color_icon } } ] }
            - label: { text: "Pool", styles: title }
      - obj:
          styles: plain
          width: 100%
          flex_grow: 1
          pad_left: 16
          pad_right: 16
          pad_bottom: 18
          scrollbar_mode: AUTO
          layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH, pad_row: 16 }
          widgets:
            # water temperature
            - obj:
                styles: card
                width: 100%
                pad_top: 15
                pad_bottom: 15
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
                widgets:
                  - obj: { width: 44, height: 44, radius: 13, bg_color: $color_accent, bg_opa: 16%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_waves}", text_font: icons_24, text_color: $color_accent } } ] }
                  - obj:
                      styles: plain
                      flex_grow: 1
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, pad_row: 2 }
                      widgets:
                        - label: { text: "Water Temperature", text_font: manrope_17, text_color: $color_text }
                        - label: { text: "Pump & heater controls", text_font: manrope_13, text_color: $color_text2 }
                  - label: { id: lbl_pool_water, text: "82°", text_font: manrope_28, text_color: $color_text }
            # filter speed segmented control
            - label: { text: "FILTER SPEED", styles: section, margin_left: 2 }
            - obj:
                styles: plain
                width: 100%
                height: 58
                layout: { type: flex, flex_flow: ROW, pad_column: 8 }
                widgets:
                  - button:
                      id: seg_off
                      flex_grow: 1
                      height: 58
                      bg_color: $color_surface
                      bg_opa: COVER
                      radius: 14
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      on_click: { homeassistant.action: { action: switch.turn_off, data: { entity_id: "${switch_pool_filter_pump}" } } }
                      widgets: [ { label: { align: CENTER, text: "Off", text_font: manrope_16, text_color: $color_icon } } ]
                  - button:
                      id: seg_low
                      flex_grow: 1
                      height: 58
                      bg_color: $color_surface
                      bg_opa: COVER
                      radius: 14
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      on_click: { homeassistant.action: { action: button.press, data: { entity_id: "${button_pool_low}" } } }
                      widgets: [ { label: { align: CENTER, text: "Low", text_font: manrope_16, text_color: $color_icon } } ]
                  - button:
                      id: seg_med
                      flex_grow: 1
                      height: 58
                      bg_color: $color_surface
                      bg_opa: COVER
                      radius: 14
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      on_click: { homeassistant.action: { action: button.press, data: { entity_id: "${button_pool_med}" } } }
                      widgets: [ { label: { align: CENTER, text: "Med", text_font: manrope_16, text_color: $color_icon } } ]
                  - button:
                      id: seg_high
                      flex_grow: 1
                      height: 58
                      bg_color: $color_accent
                      bg_opa: 16%
                      radius: 14
                      border_width: 1
                      border_color: $color_accent
                      border_opa: 55%
                      on_click: { homeassistant.action: { action: button.press, data: { entity_id: "${button_pool_high}" } } }
                      widgets: [ { label: { align: CENTER, text: "High", text_font: manrope_16, text_color: $color_accent_light } } ]
            # heater
            - label: { text: "HEATER", styles: section, margin_left: 2 }
            - obj:
                styles: card
                width: 100%
                pad_top: 13
                pad_bottom: 13
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
                widgets:
                  - obj: { width: 44, height: 44, radius: 13, bg_color: $color_accent, bg_opa: 16%, border_width: 0, pad_all: 0, widgets: [ { label: { align: CENTER, text: "${i_heat}", text_font: icons_24, text_color: $color_accent } } ] }
                  - label: { text: "Heater", text_font: manrope_17, text_color: $color_text, flex_grow: 1 }
                  - switch:
                      id: sw_heater
                      width: 58
                      height: 34
                      bg_color: $color_border
                      bg_opa: 12%
                      indicator:
                        checked: { bg_color: $color_accent, bg_opa: COVER }
                      knob: { bg_color: $color_white, bg_opa: COVER }
                      on_value:
                        - homeassistant.action:
                            action: !lambda 'return std::string(x ? "water_heater.turn_on" : "water_heater.turn_off");'
                            data: { entity_id: "${switch_pool_heater}" }
            # setpoint stepper
            - obj:
                styles: card
                width: 100%
                pad_top: 14
                pad_bottom: 14
                pad_left: 18
                pad_right: 18
                layout: { type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER }
                widgets:
                  - button:
                      width: 60
                      height: 60
                      radius: 17
                      bg_color: $color_surface
                      bg_opa: COVER
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      on_click:
                        - homeassistant.action:
                            action: input_number.set_value
                            data: { entity_id: "${number_pool_setpoint}", value: !lambda 'return std::max(60.0f, id(num_pool_setpoint).state - 1.0f);' }
                      widgets: [ { label: { align: CENTER, text: "${i_minus}", text_font: icons_28, text_color: $color_text } } ]
                  - obj:
                      styles: plain
                      width: SIZE_CONTENT
                      height: SIZE_CONTENT
                      layout: { type: flex, flex_flow: COLUMN, flex_align_cross: CENTER, pad_row: 4 }
                      widgets:
                        - label: { id: lbl_setpoint, text: "84°", text_font: manrope_42, text_color: $color_text }
                        - label: { text: "SET TEMPERATURE", styles: section }
                  - button:
                      width: 60
                      height: 60
                      radius: 17
                      bg_color: $color_surface
                      bg_opa: COVER
                      border_width: 1
                      border_color: $color_border
                      border_opa: 8%
                      on_click:
                        - homeassistant.action:
                            action: input_number.set_value
                            data: { entity_id: "${number_pool_setpoint}", value: !lambda 'return std::min(104.0f, id(num_pool_setpoint).state + 1.0f);' }
                      widgets: [ { label: { align: CENTER, text: "${i_plus}", text_font: icons_28, text_color: $color_text } } ]

  # ---------------------------------------------------------------
  #  9. SETTINGS  (grouped toggle list)
  # ---------------------------------------------------------------
  - id: page_settings
    bg_color: $color_bg
    bg_opa: COVER
    pad_all: 0
    layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH }
    widgets:
      - obj:
          styles: plain
          width: 100%
          height: 60
          pad_left: 18
          pad_top: 17
          layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 13 }
          widgets:
            - button: { styles: back_btn, on_click: { lvgl.page.show: page_home }, widgets: [ { label: { align: CENTER, text: "${i_back}", text_font: icons_22, text_color: $color_icon } } ] }
            - label: { text: "Settings", styles: title }
      - obj:
          styles: plain
          width: 100%
          flex_grow: 1
          pad_left: 16
          pad_right: 16
          pad_bottom: 18
          scrollbar_mode: AUTO
          layout: { type: flex, flex_flow: COLUMN, flex_align_cross: STRETCH, pad_row: 8 }
          widgets:
            # group header pattern: icon + title + divider
            - &group_header
              obj:
                styles: plain
                width: 100%
                height: SIZE_CONTENT
                margin_top: 12
                margin_bottom: 2
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 9 }
                widgets:
                  - label: { text: "${i_home}", text_font: icons_22, text_color: $color_icon }
