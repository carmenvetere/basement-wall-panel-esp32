                              - label: { id: lbl_spr_time, text: "12:40", text_font: manrope_24, text_color: $color_text }
                              - label: { text: "remaining", text_font: manrope_13, text_color: $color_text2 }
                  - button:
                      width: 100%
                      height: 52
                      bg_color: $color_accent
                      bg_opa: COVER
                      radius: 14
                      layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 8 }
