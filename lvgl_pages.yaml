                widgets:
                  - label: { text: "${i_water}", text_font: icons_22, text_color: $color_accent }
                  - label: { text: "Front Lawn", text_font: manrope_16, text_color: $color_text, flex_grow: 1 }
                  - obj: { width: SIZE_CONTENT, height: 28, radius: 14, bg_color: $color_accent, bg_opa: 14%, border_width: 0, pad_left: 12, pad_right: 12, pad_top: 0, pad_bottom: 0, layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER }, widgets: [ { label: { text: "Running", text_font: manrope_13, text_color: $color_accent } } ] }
            - obj:
                styles: card
                width: 100%
                pad_all: 14
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                widgets:
                  - label: { text: "${i_water}", text_font: icons_22, text_color: $color_warning }
                  - label: { text: "Back Lawn", text_font: manrope_16, text_color: $color_text, flex_grow: 1 }
                  - obj: { width: SIZE_CONTENT, height: 28, radius: 14, bg_color: $color_warning, bg_opa: 14%, border_width: 0, pad_left: 12, pad_right: 12, layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER }, widgets: [ { label: { text: "Queued", text_font: manrope_13, text_color: $color_warning } } ] }
            - obj:
                styles: card
                width: 100%
                pad_all: 14
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                widgets:
                  - label: { text: "${i_water}", text_font: icons_22, text_color: $color_dim }
                  - label: { text: "Garden Beds", text_font: manrope_16, text_color: $color_text, flex_grow: 1 }
                  - obj: { width: SIZE_CONTENT, height: 28, radius: 14, bg_color: $color_border, bg_opa: 6%, border_width: 0, pad_left: 12, pad_right: 12, layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER }, widgets: [ { label: { text: "Idle", text_font: manrope_13, text_color: $color_dim } } ] }
            - obj:
                styles: card
                width: 100%
                pad_all: 14
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 12 }
                widgets:
                  - label: { text: "${i_water}", text_font: icons_22, text_color: $color_dim }
