            - obj:
                styles: plain
                width: 100%
                height: SIZE_CONTENT
                margin_top: 12
                margin_bottom: 2
                layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 9 }
                widgets:
                  - label: { text: "${i_flash}", text_font: icons_22, text_color: $color_icon }
