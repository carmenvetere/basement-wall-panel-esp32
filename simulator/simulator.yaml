# ===================================================================
#  simulator.yaml  —  Desktop preview of the wall-panel dashboard
#
#  Runs the EXACT same LVGL UI + Home Assistant logic (common/dashboard.yaml)
#  on your computer in an SDL window using ESPHome's "host" platform —
#  NO ESP32 hardware needed. Your mouse acts as the touchscreen.
#
#  Two ways to use it:
#   * Offline UI preview  -> just run it; HA-bound labels show defaults.
#   * Live against HA     -> add this "device" in Home Assistant's ESPHome
#                            integration (it connects over your network like
#                            a real panel), then every control/sensor is live.
#
#  Run it:
#     esphome run simulator/simulator.yaml
#  (Needs SDL2 — see README "Step 2: Preview in the simulator".)
# ===================================================================

# ---- Shared core: design tokens, entities, fonts, HA bindings, UI ----
packages:
  core: !include ../common/dashboard.yaml

esphome:
  name: wall-panel-sim

# Build + run on this computer instead of an ESP32.
host:

# API so the simulator can talk to Home Assistant (no encryption needed
# on the host). Remove this block for a purely offline UI preview.
api:

# Render to an SDL window; the mouse acts as the touchscreen.
display:
  - platform: sdl
    id: main_display
    # The SDL window only repaints on this interval. The display default is
    # 1000ms, which makes the simulator look frozen / unresponsive to clicks
    # (LVGL processes input immediately, but you don't SEE it until the next
    # repaint). ~60fps makes it feel live.
    update_interval: 16ms
    dimensions:
      width: 480
      height: 480

touchscreen:
  - platform: sdl
    id: main_touch
    display: main_display
    # TEMP DIAGNOSTIC #2: on every release, log it AND force a page change.
    # This bypasses widget hit-testing. If clicking anywhere in the window
    # cycles through the 9 pages, LVGL IS acting on touch (problem is
    # elsewhere). If pages never change, LVGL isn't processing input/render.
    on_release:
      - logger.log:
          level: WARN
          format: "RELEASE -> lvgl.page.next"
      - lvgl.page.next:

# TEMP DIAGNOSTIC #1: drive the clock label locally (no Home Assistant
# needed) so we can tell if LVGL is rendering at all. If the number on the
# Home screen counts up every second, rendering works; if it's frozen,
# LVGL/the SDL display isn't updating.
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda 'static int n = 0; return std::to_string(n++);'
