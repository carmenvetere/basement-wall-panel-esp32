# ===================================================================
#  nspanel-dashboard.yaml  —  REAL HARDWARE target
#  ESP32-S3 + 480x480 touch panel (e.g. Guition ESP32-4848S040:
#  ST7701S RGB panel + GT911 touch).
#
#  The UI + all Home Assistant logic live in common/dashboard.yaml
#  (shared with the desktop simulator). This file only adds the
#  hardware-specific layer.
#
#  >>> BEFORE FLASHING, edit:
#    1. secrets.yaml      -> Wi-Fi / API key / OTA password
#    2. common/dashboard.yaml `substitutions:` -> your real HA entity_ids
#    3. The display:/touchscreen:/spi:/i2c: block below -> your board's
#       known-good values (pins + init_sequence). If you already run
#       ESPHome on this panel, paste its working blocks over these.
#    4. Verify icon codepoints (see docs/HANDOFF.md).
#  See README.md for the full step-by-step guide.
# ===================================================================

# ---- Shared core: design tokens, entities, fonts, HA bindings, UI ----
packages:
  core: !include common/dashboard.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}


esp32:
  board: esp32-s3-devkitc-1   # TODO: set to your board
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal       # TODO: match your board (most 480x480 S3 panels use octal PSRAM)
  speed: 80MHz


api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# -------------------------------------------------------------------
#  DISPLAY + TOUCH   >>> TODO: replace with YOUR board's known-good config
#  The ST7701S init is sent over a (bit-banged) SPI bus; the RGB data
#  goes over the parallel data_pins below. GT911 touch is on I2C.
# -------------------------------------------------------------------

spi:                 # used by st7701s to send its init sequence
  - id: lcd_spi
    clk_pin: GPIO48    # TODO: match your board
    mosi_pin: GPIO47   # TODO: match your board

i2c:
  - id: bus_touch
    sda: GPIO19      # TODO pins
    scl: GPIO45
    scan: true


display:
  - platform: st7701s
    id: main_display
    update_interval: never        # LVGL drives updates
    auto_clear_enabled: false
    data_rate: 12MHz
    spi_mode: MODE3
    color_order: RGB
    dimensions:
      width: 480
      height: 480
    # --- TODO: pins + init_sequence for your exact board ---
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    hsync_back_porch: 10
    hsync_front_porch: 8
    hsync_pulse_width: 8
    vsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 8
    data_pins:
      red:   [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue:  [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]
    # init_sequence: !include st7701s_init.yaml   # board specific


touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    i2c_id: bus_touch

# Optional: backlight dimming
# output:
#   - platform: ledc
#     pin: GPIO38
#     id: backlight_pwm
# light:
#   - platform: monochromatic
#     output: backlight_pwm
#     id: backlight
#     restore_mode: ALWAYS_ON
